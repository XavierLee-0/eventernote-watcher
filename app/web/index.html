<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventernote Watcher</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="/static/calendar-view.js?v=20261028-week-view"></script>
<style>
  :root { --border: #e2e8f0; --muted: #718096; --accent: #4f6ef7; --bg: #f7fafc; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: #2d3748; }
  .layout { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
  h1 { font-size: 20px; margin: 0; }
  nav { display: flex; gap: 4px; margin-bottom: 16px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  nav button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 7px; cursor: pointer; font-size: 14px; color: var(--muted); }
  nav button.active { background: var(--accent); color: #fff; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  input, select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; background: #fff; }
  input.wide { width: 100%; }
  button.btn { padding: 8px 14px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer; font-size: 14px; }
  button.btn.ghost { background: #edf2f7; color: #2d3748; }
  button.btn.danger { background: #e53e3e; }
  button.btn:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; }
  .tag.ok { background: #c6f6d5; color: #22543d; }
  .tag.err { background: #fed7d7; color: #742a2a; }
  .tag.off { background: #e2e8f0; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 13px; }
  .switch input { display: none; }
  .switch .track { width: 40px; height: 22px; border-radius: 99px; background: #cbd5e0; position: relative; transition: background .15s; }
  .switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 20px; }
  .pill { cursor: pointer; user-select: none; }
  .search-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2d3748; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 9; }
  label.field { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .channel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .channel .head { display: flex; justify-content: space-between; align-items: center; }
  code { background:#edf2f7; padding:1px 5px; border-radius:4px; font-size:12px; }
  .view-switch { display:flex; gap:3px; padding:3px; background:#edf2f7; border-radius:8px; }
  .view-switch button { border:0; background:transparent; color:#4a5568; border-radius:5px; padding:6px 12px; cursor:pointer; }
  .view-switch button.active { background:#fff; color:var(--accent); box-shadow:0 1px 4px #0001; }
  .calendar-toolbar { margin:16px 0 12px; }
  .month-picker { font-weight:600; color:#2d3748; max-width:170px; }
  .calendar-grid { --calendar-day-height:104px; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:28px repeat(6,var(--calendar-day-height)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .weekday { text-align:center; background:#f7fafc; padding:7px 0; color:var(--muted); font-size:12px; }
  .calendar-day { min-width:0; min-height:0; height:100%; overflow:hidden; padding:6px; border:0; background:#fff; text-align:left; color:#2d3748; cursor:pointer; font:inherit; display:flex; flex-direction:column; gap:4px; }
  .calendar-day:hover { background:#f5f7ff; }
  .calendar-day:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
  .calendar-day.outside { background:#f7fafc; color:#a0aec0; }
  .calendar-day.selected { background:#edf2ff; box-shadow:inset 0 0 0 2px var(--accent); }
  .day-head { display:flex; flex-shrink:0; align-items:center; justify-content:space-between; gap:2px; font-size:12px; }
  .day-number { display:inline-flex; align-items:center; justify-content:center; width:23px; height:23px; border-radius:50%; }
  .day-number.today { background:var(--accent); color:#fff; font-weight:700; }
  .day-count { color:var(--accent); font-size:10px; white-space:nowrap; }
  .calendar-display-controls { margin:10px 0; }
  .day-content { display:flex; flex-direction:column; gap:3px; min-width:0; min-height:0; flex:1; overflow:hidden; }
  .calendar-artist { display:flex; flex-shrink:0; align-items:center; gap:3px; border-left:3px solid; border-radius:4px; padding:3px 4px; font-size:11px; font-weight:600; line-height:16px; }
  .calendar-artist-name, .event-preview-title { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .calendar-artist-name { flex:1; min-width:0; }
  .artist-event-count { flex-shrink:0; font-size:9px; font-weight:400; padding-top:1px; }
  .event-preview { display:block; flex-shrink:0; max-width:100%; border-left:3px solid; border-radius:4px; padding:3px 4px; font-size:11px; line-height:16px; }
  .event-preview-title { font-size:11px; }
  .more-items { display:block; flex-shrink:0; color:var(--muted); font-size:10px; line-height:12px; white-space:nowrap; padding-left:4px; }
  .calendar-note { margin:10px 0 0; }
  .day-details { scroll-margin-top:16px; }
  .event-detail { padding:12px 0; border-bottom:1px solid var(--border); }
  .event-detail:last-child { border-bottom:0; padding-bottom:0; }
  .event-title { color:#334dab; font-weight:600; font-size:14px; text-decoration:none; line-height:1.6; overflow-wrap:anywhere; }
  .event-title:hover { text-decoration:underline; }
  .event-meta { margin:5px 0; font-size:12px; color:#4a5568; line-height:1.6; }
  .artist-tag { display:inline-block; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; vertical-align:middle; border:1px solid; border-radius:4px; padding:2px 6px; margin:4px 4px 0 0; font-size:11px; }
  .table-scroll { overflow-x:auto; }
  details.card summary { cursor:pointer; font-size:14px; font-weight:600; }
  .week-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; align-items:stretch; }
  .week-day { min-width:0; min-height:440px; background:#f7fafc; border:1px solid var(--border); border-radius:8px; padding:8px; }
  .week-day.is-today { border-color:var(--accent); background:#f5f7ff; }
  .week-day-header { display:flex; align-items:center; justify-content:space-between; gap:4px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .week-date { font-size:14px; font-weight:600; }
  .week-date small { display:block; margin-top:3px; font-size:11px; font-weight:400; color:var(--muted); }
  .week-events { display:flex; flex-direction:column; gap:10px; }
  .week-event { display:flex; flex-direction:column; gap:5px; min-width:0; max-height:200px; overflow:hidden; border:1px solid; border-left-width:3px; border-radius:6px; padding:6px; }
  .week-event-title { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; flex-shrink:0; overflow:hidden; color:inherit; font-weight:600; font-size:12px; line-height:18px; text-decoration:none; overflow-wrap:anywhere; }
  .week-event-title:hover { text-decoration:underline; }
  .week-event-meta { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; flex-shrink:0; overflow:hidden; margin:0; font-size:11px; line-height:15px; overflow-wrap:anywhere; color:#4a5568; }
  .week-event-artists { display:flex; flex-wrap:wrap; flex-shrink:0; gap:3px; min-width:0; max-height:39px; overflow:hidden; }
  .week-event .artist-tag { margin:0; padding:1px 4px; font-size:10px; line-height:14px; }
  .week-range { font-size:13px; font-weight:600; }
  @media(max-width:600px) {
    .layout { padding:10px; } header { flex-wrap:wrap; } .calendar-card { padding:10px; }
    .calendar-grid { --calendar-day-height:88px; }
    .calendar-day { padding:4px; gap:3px; }
    .day-count { font-size:9px; } .day-number { width:20px; height:20px; }
    .calendar-artist, .event-preview { font-size:10px; line-height:14px; padding:2px 3px; }
    .event-preview-title { font-size:10px; }
    .calendar-toolbar { gap:6px; } .calendar-toolbar button.btn { padding:7px 9px; }
    .calendar-toolbar .month-picker { padding:6px; max-width:144px; }
    .week-grid { grid-template-columns:1fr; }
    .week-day { min-height:0; }
    .week-event-title { font-size:13px; }
  }
</style>
</head>
<body>
<div id="app" class="layout">
  <header>
    <h1>🎤 Eventernote Watcher</h1>
    <div class="row">
      <span class="muted">
        {{ status.last_run_at ? '上次抓取 ' + status.last_run_at : '尚未抓取' }}
        <template v-if="status.next_run_at"> · 下次 {{ status.next_run_at }}</template>
      </span>
      <button class="btn" :disabled="status.running" @click="runNow">
        {{ status.running ? '抓取中…' : '立即抓取' }}
      </button>
    </div>
  </header>

  <nav>
    <button :class="{active: tab==='actors'}" @click="tab='actors'">出演者</button>
    <button :class="{active: tab==='events'}" @click="tab='events'">活动日历</button>
    <button :class="{active: tab==='settings'}" @click="tab='settings'">设置</button>
    <button :class="{active: tab==='logs'}" @click="tab='logs'">日志</button>
  </nav>

  <!-- 出演者 -->
  <template v-if="tab==='actors'">
    <div class="card">
      <div class="row">
        <input class="grow" v-model="searchKw" placeholder="出演者名（需用日文汉字写法，如 斉藤朱夏）" @keyup.enter="doSearch">
        <button class="btn" @click="doSearch" :disabled="searching">{{ searching ? '搜索中…' : '搜索' }}</button>
      </div>
      <div v-if="searchResults.length" style="margin-top:10px">
        <div class="search-item" v-for="r in searchResults" :key="r.actor_id">
          <div>
            <b>{{ r.name }}</b>
            <span class="muted"> #{{ r.actor_id }} · ♥ {{ r.favorite_count }}</span>
          </div>
          <button v-if="r.watched" class="btn ghost" disabled>已添加</button>
          <button v-else class="btn" @click="addActor(r)">添加</button>
        </div>
      </div>
      <p class="muted" style="margin:10px 0 0">
        搜不到？可能是同名/相似名过多或站点搜索排序问题。可先试日文读法（如搜「イコールラブ」找 =LOVE），
        或用下方手动添加。
      </p>
    </div>

    <div class="card">
      <b style="font-size:14px">手动添加</b>
      <div class="row" style="margin-top:8px">
        <input v-model.number="manualId" type="number" placeholder="actor_id（出演者页面 URL 末尾数字）" style="width:280px">
        <input v-model="manualName" placeholder="出演者名（仅用于显示）" style="width:200px">
        <button class="btn" @click="addManual" :disabled="!manualId || !manualName">添加</button>
      </div>
      <p class="muted" style="margin:8px 0 0">打开出演者的 Eventernote 页面，URL 形如 <code>/actors/斉藤朱夏/15436</code>，末尾数字即 actor_id。名字只影响显示，抓取按 actor_id 进行。</p>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>出演者</th><th>状态</th><th>上次抓取</th><th></th></tr></thead>
        <tbody>
          <tr v-if="!actors.length"><td colspan="4" class="muted">还没有添加出演者，先在上方搜索添加</td></tr>
          <tr v-for="a in actors" :key="a.actor_id">
            <td><b>{{ a.name }}</b><div class="muted">#{{ a.actor_id }}</div></td>
            <td>
              <label class="switch">
                <input type="checkbox" :checked="a.enabled" @change="toggleActor(a)">
                <span class="track"></span>
                <span>{{ a.enabled ? '监视中' : '已暂停' }}</span>
              </label>
            </td>
            <td>
              <template v-if="a.last_fetch_at">
                <span :class="a.last_fetch_ok ? '' : 'muted'">{{ a.last_fetch_at }}</span>
                <div v-if="a.last_error" class="muted" :title="a.last_error">⚠ {{ a.last_error.slice(0,30) }}</div>
              </template>
              <span v-else class="muted">未抓取</span>
            </td>
            <td style="text-align:right"><button class="btn danger" @click="delActor(a)">删除</button></td>
          </tr>
        </tbody>
      </table>
      <p class="muted">新添加的出演者首次抓取只建立基线（不发通知），之后出现的新活动才会推送。</p>
    </div>
  </template>

  <!-- 活动 -->
  <template v-if="tab==='events'">
    <div class="card calendar-card" :aria-busy="eventsLoading">
      <div class="row">
        <select v-model="eventsActor" aria-label="筛选出演者">
          <option :value="null">全部出演者</option>
          <option v-for="a in actors" :key="a.actor_id" :value="a.actor_id">{{ a.name }}</option>
        </select>
        <label class="row" style="gap:4px;font-size:13px"><input type="checkbox" v-model="futureOnly"> 只看未来</label>
        <span class="grow"></span>
        <div class="view-switch" aria-label="活动视图">
          <button :class="{active:eventView==='calendar'}" :aria-pressed="eventView==='calendar'" @click="eventView='calendar'">月历</button>
          <button :class="{active:eventView==='week'}" :aria-pressed="eventView==='week'" @click="openWeek">周历</button>
          <button :class="{active:eventView==='list'}" :aria-pressed="eventView==='list'" @click="eventView='list'">列表</button>
        </div>
        <button class="btn ghost" :disabled="eventsLoading" @click="refreshEvents">{{ eventsLoading ? '读取中…' : '刷新活动' }}</button>
      </div>
      <p v-if="eventsError" role="alert" style="color:#c53030">{{ eventsError }}</p>

      <template v-if="eventView==='calendar'">
        <div class="row calendar-toolbar">
          <button class="btn ghost" aria-label="上个月" @click="changeMonth(-1)">‹</button>
          <input class="month-picker" type="month" aria-label="选择月份" :value="calendarMonth" @change="pickMonth($event.target.value)">
          <button class="btn ghost" aria-label="下个月" @click="changeMonth(1)">›</button>
          <button class="btn ghost" @click="goToday">今天</button>
          <button v-if="nearestDate" class="btn ghost" @click="selectDate(nearestDate)">最近活动</button>
          <span class="grow"></span>
          <span class="muted">本月 {{ monthEventCount }} 场 · 共 {{ visibleEvents.length }} 场已抓取活动</span>
        </div>
        <div class="row calendar-display-controls">
          <span class="muted">日期格显示</span>
          <div class="view-switch" aria-label="日期格显示内容">
            <button :class="{active:calendarContent==='actors'}" :aria-pressed="calendarContent==='actors'" @click="calendarContent='actors'">艺人</button>
            <button :class="{active:calendarContent==='events'}" :aria-pressed="calendarContent==='events'" @click="calendarContent='events'">活动</button>
          </div>
          <span class="grow"></span>
          <span class="muted">最多显示 2 项，点击日期查看全部</span>
        </div>
        <div class="calendar-grid" aria-label="活动月历">
          <div v-for="weekday in ['一','二','三','四','五','六','日']" :key="weekday" class="weekday">周{{ weekday }}</div>
          <button v-for="day in calendarDays" :key="day.key" class="calendar-day" :class="{outside:!day.inMonth,selected:selectedDate===day.key}"
            :aria-label="day.key + '，' + day.artists.length + ' 位艺人，' + day.events.length + ' 场活动'" :aria-pressed="selectedDate===day.key" :aria-current="day.key===today ? 'date' : undefined" @click="selectDate(day.key)">
            <span class="day-head"><span class="day-number" :class="{today:day.key===today}">{{ day.day }}</span><span v-if="day.events.length" class="day-count">{{ calendarContent==='actors' ? day.artists.length + ' 人' : day.events.length + ' 场' }}</span></span>
            <span class="day-content">
              <template v-if="calendarContent==='actors'">
                <span v-for="artist in day.artists.slice(0,2)" :key="artist.id" class="calendar-artist" :style="artistStyle(artist)" :title="artist.name + ' · ' + artist.eventCount + ' 场活动'">
                  <span class="calendar-artist-name">{{ artist.name }}</span><span v-if="artist.eventCount>1" class="artist-event-count">×{{ artist.eventCount }}</span>
                </span>
              </template>
              <template v-else>
                <span v-for="event in day.events.slice(0,2)" :key="event.event_id" class="event-preview" :style="artistStyle(event.actors[0])" :title="event.actors.map(a=>a.name).join('、') + '：' + event.name">
                  <span class="event-preview-title">{{ event.name }}</span>
                </span>
              </template>
              <span v-if="(calendarContent==='actors' ? day.artists.length : day.events.length)>2" class="more-items" :title="'点击日期查看剩余 ' + ((calendarContent==='actors' ? day.artists.length : day.events.length)-2) + ' 项'">+{{ (calendarContent==='actors' ? day.artists.length : day.events.length)-2 }}</span>
            </span>
          </button>
        </div>
        <p v-if="!eventsLoading && !monthEventCount" class="muted calendar-note">本月暂无符合筛选条件的已抓取活动，可切换月份或点击「最近活动」。</p>
        <p v-else class="muted calendar-note">每格最多显示两个单行标签，+数字表示其余项目。点击日期查看全部；艺人名后的 ×数字表示当天场数。</p>
        <button v-if="undatedEvents.length" class="btn ghost" style="margin-top:10px" @click="selectedDate='undated'">日期未定 · {{ undatedEvents.length }} 场</button>
      </template>
      <template v-else-if="eventView==='week'">
        <div class="row calendar-toolbar">
          <button class="btn ghost" aria-label="上一周" @click="changeWeek(-1)">‹</button>
          <input type="date" aria-label="选择周内日期" :value="weekAnchor" @change="pickWeek($event.target.value)">
          <button class="btn ghost" aria-label="下一周" @click="changeWeek(1)">›</button>
          <button class="btn ghost" @click="goThisWeek">本周</button>
          <button v-if="nearestDate" class="btn ghost" @click="pickWeek(nearestDate)">最近活动</button>
          <span class="grow"></span>
          <span class="week-range">{{ weekDays[0]?.key }} — {{ weekDays[6]?.key }}</span>
          <span class="muted">本周 {{ weekEventCount }} 场</span>
        </div>
        <div class="week-grid" aria-label="活动周历">
          <section v-for="day in weekDays" :key="day.key" class="week-day" :class="{'is-today':day.key===today}" :aria-label="day.key + '，' + day.events.length + ' 场活动'">
            <div class="week-day-header">
              <time class="week-date" :datetime="day.key">{{ day.key.slice(5).replace('-','/') }}<small>周{{ day.weekday }}{{ day.key===today ? ' · 今天' : '' }}</small></time>
              <span class="tag off">{{ day.events.length }} 场</span>
            </div>
            <p v-if="!day.events.length" class="muted">{{ eventsLoading ? '读取中…' : '暂无活动' }}</p>
            <div class="week-events">
              <article v-for="event in day.events" :key="event.event_id" class="week-event" :style="artistStyle(event.actors[0])" :data-event-id="event.event_id">
                <a class="week-event-title" :href="event.url" :title="event.name" target="_blank" rel="noopener noreferrer">{{ event.name }} ↗</a>
                <p class="week-event-meta" :title="event.open_time || '时间未公布'">{{ event.open_time || '时间未公布' }}</p>
                <p class="week-event-meta" :title="event.place || '未提供'">会场：{{ event.place || '未提供' }}</p>
                <div class="week-event-artists"><span v-for="artist in event.actors" :key="artist.id" class="artist-tag" :style="artistStyle(artist)" :title="artist.name">{{ artist.name }}</span></div>
              </article>
            </div>
          </section>
        </div>
        <p class="muted calendar-note">本周活动全部列出，按开演时间排列。每张卡片最高 200px，标题最多三行；悬停查看全文，点击标题打开原页面。</p>
        <p v-if="undatedEvents.length" class="muted">另有 {{ undatedEvents.length }} 场日期未定活动，可在月历的「日期未定」中查看。</p>
      </template>
      <div v-else class="table-scroll">
      <p class="muted">共 {{ visibleEvents.length }} 场已抓取活动</p>
      <table style="margin-top:8px">
        <thead><tr><th>日期</th><th>活动</th><th>出演者</th><th>会场</th></tr></thead>
        <tbody>
          <tr v-if="!visibleEvents.length"><td colspan="4" class="muted">{{ eventsLoading ? '正在读取…' : '暂无符合筛选条件的活动数据（可先抓取一次）' }}</td></tr>
          <tr v-for="e in visibleEvents" :key="e.event_id">
            <td style="white-space:nowrap">{{ e.date || '未定' }}</td>
            <td><a :href="e.url" target="_blank" rel="noopener noreferrer">{{ e.name }}</a><div class="muted" v-if="e.open_time">{{ e.open_time }}</div></td>
            <td><span v-for="artist in e.actors" :key="artist.id" class="artist-tag" :style="artistStyle(artist)">{{ artist.name }}</span></td>
            <td>{{ e.place }}</td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
    <section v-if="eventView==='calendar'" id="calendar-day-details" class="card day-details" aria-label="所选日期活动">
      <div class="row"><b style="font-size:15px">{{ selectedDate==='undated' ? '日期未定' : selectedDate }} 的活动</b><span class="tag off">{{ selectedEvents.length }} 场</span></div>
      <p v-if="!selectedEvents.length" class="muted">{{ eventsLoading ? '正在读取已抓取活动…' : '当天暂无符合筛选条件的已抓取活动。' }}</p>
      <article class="event-detail" v-for="event in selectedEvents" :key="event.event_id">
        <a class="event-title" :href="event.url" target="_blank" rel="noopener noreferrer">{{ event.name }} ↗</a>
        <p class="event-meta">{{ event.open_time || '时间未公布' }}<br>会场：{{ event.place || '未提供' }}</p>
        <span v-for="artist in event.actors" :key="artist.id" class="artist-tag" :style="artistStyle(artist)">{{ artist.name }}</span>
      </article>
    </section>
    <details class="card">
      <summary>外部日历订阅</summary>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" @click="copyCal">复制订阅链接</button>
        <a class="btn ghost" style="text-decoration:none" :href="calUrl + (calUrl.includes('?') ? '&all=true' : '?all=true')" target="_blank" rel="noopener noreferrer">打开 .ics</a>
      </div>
      <p><code style="word-break:break-all">{{ calUrl }}</code></p>
      <p class="muted">订阅后由日历客户端定时刷新，默认只包含未来活动。Google Calendar 需要可从公网访问的订阅地址。</p>
    </details>
  </template>

  <!-- 设置 -->
  <template v-if="tab==='settings'">
    <div class="card">
      <b>抓取</b>
      <label class="field">每日定点时刻（逗号分隔的 HH:MM，按容器时区，默认北京时间；留空则改用下方间隔模式）</label>
      <input class="wide" v-model="settings.poll_schedule" placeholder="如 01:00, 09:00, 17:00">
      <label class="field">间隔模式（仅当定点时刻留空时生效，单位小时）</label>
      <input type="number" min="1" step="1" v-model.number="settings.poll_interval_hours" style="width:120px">
      <p class="muted" style="margin:8px 0 0">当前模式：<b>{{ settings.poll_schedule ? '定点 (' + settings.poll_schedule + ')' : '间隔 ' + settings.poll_interval_hours + ' 小时' }}</b>，保存后最多 15 分钟内生效。抓取太频繁想减少次数：减少定点时刻的个数，或调大间隔。</p>
    </div>

    <div class="card" v-for="(cfg, key) in settings.notifiers" :key="key">
      <div class="channel" style="border:0;padding:0">
        <div class="head">
          <b>{{ channelLabel(key) }}</b>
          <label class="switch">
            <input type="checkbox" v-model="cfg.enabled">
            <span class="track"></span>
            <span>{{ cfg.enabled ? '启用' : '停用' }}</span>
          </label>
        </div>

        <template v-if="key==='wxpusher'">
          <label class="field">app_token（wxpusher.zjiecode.com 创建应用获取）</label>
          <input class="wide" v-model="cfg.app_token">
          <label class="field">uid（关注公众号后在「用户」页获取）</label>
          <input class="wide" v-model="cfg.uid">
        </template>
        <template v-if="key==='pushplus'">
          <label class="field">token（pushplus.plus 微信扫码获取）</label>
          <input class="wide" v-model="cfg.token">
        </template>
        <template v-if="key==='email'">
          <div class="row">
            <div class="grow"><label class="field">SMTP 服务器</label><input class="wide" v-model="cfg.host"></div>
            <div><label class="field">端口</label><input type="number" v-model.number="cfg.port" style="width:90px"></div>
          </div>
          <div class="row">
            <div class="grow"><label class="field">用户名</label><input class="wide" v-model="cfg.username"></div>
            <div class="grow"><label class="field">密码 / 授权码</label><input class="wide" type="password" v-model="cfg.password"></div>
          </div>
          <div class="row">
            <div class="grow"><label class="field">发件地址</label><input class="wide" v-model="cfg.from_addr"></div>
            <div class="grow"><label class="field">收件地址（多个用逗号分隔）</label><input class="wide" v-model="cfg.to_addr"></div>
          </div>
          <label class="row" style="gap:4px;margin-top:8px"><input type="checkbox" v-model="cfg.use_ssl"> SSL（465 端口；关闭则用 587 STARTTLS）</label>
        </template>
      </div>
    </div>

    <div class="row">
      <button class="btn" @click="saveSettings" :disabled="savingSettings">{{ savingSettings ? '保存中…' : '保存设置' }}</button>
      <button class="btn ghost" @click="testNotify" :disabled="testing">{{ testing ? '发送中…' : '发送测试推送' }}</button>
      <button class="btn ghost" @click="simulateNotify" :disabled="simulating">{{ simulating ? '发送中…' : '模拟新活动通知' }}</button>
      <span class="muted">「测试推送」只验证渠道连通；「模拟新活动通知」用真实活动数据走完整通知流程（内容与真实新活动完全一致），适合预览邮件/推送的效果</span>
    </div>

    <div class="card">
      <b>配置备份</b>
      <p class="muted" style="margin:8px 0">导出演者列表、全部设置（含通知渠道 token）和活动快照，用于迁移部署或备份。<b>文件含密钥，请妥善保管。</b>导入会替换当前出演者列表；含快照的导入可无缝衔接（不重建基线、不漏报），旧版无快照文件导入后首次抓取重建基线。</p>
      <div class="row">
        <button class="btn ghost" @click="exportConfig">导出配置</button>
        <button class="btn ghost" @click="$refs.importFile.click()" :disabled="importing">{{ importing ? '导入中…' : '导入配置' }}</button>
        <input ref="importFile" type="file" accept=".json,application/json" style="display:none" @change="importConfig">
      </div>
    </div>
  </template>

  <!-- 日志 -->
  <template v-if="tab==='logs'">
    <nav style="margin-bottom:12px">
      <button :class="{active: logTab==='notify'}" @click="logTab='notify'; loadLogs()">通知推送</button>
      <button :class="{active: logTab==='fetch'}" @click="logTab='fetch'; loadLogs()">抓取记录</button>
    </nav>

    <div class="card" v-if="logTab==='notify'">
      <table>
        <thead><tr><th>时间</th><th>渠道</th><th>标题</th><th>结果</th></tr></thead>
        <tbody>
          <tr v-if="!notifications.length"><td colspan="4" class="muted">暂无通知记录</td></tr>
          <tr v-for="n in notifications" :key="n.id">
            <td style="white-space:nowrap">{{ n.created_at }}</td>
            <td>{{ n.channel }}</td>
            <td>{{ n.title }}</td>
            <td><span class="tag" :class="n.ok ? 'ok' : 'err'">{{ n.ok ? '成功' : '失败' }}</span>
                <div v-if="n.error" class="muted">{{ n.error }}</div></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card" v-if="logTab==='fetch'">
      <table>
        <thead><tr><th>时间</th><th>出演者</th><th>结果</th><th>抓到/新增</th><th>错误</th></tr></thead>
        <tbody>
          <tr v-if="!fetchLogs.length"><td colspan="5" class="muted">暂无抓取记录</td></tr>
          <tr v-for="f in fetchLogs" :key="f.id">
            <td style="white-space:nowrap">{{ f.created_at }}</td>
            <td>{{ f.actor_name }}</td>
            <td><span class="tag" :class="f.ok ? 'ok' : 'err'">{{ f.ok ? '成功' : '失败' }}</span></td>
            <td>{{ f.ok ? f.events_count + ' / ' + f.new_count : '-' }}</td>
            <td class="muted" style="max-width:260px;word-break:break-all">{{ f.error || '' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>

  <div v-if="toast" class="toast">{{ toast }}</div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, watch, nextTick } = Vue;

createApp({
  setup() {
    const tab = ref('events');
    const toast = ref('');
    const showToast = (msg) => { toast.value = msg; setTimeout(() => toast.value = '', 3000); };

    const status = reactive({ running: false, last_run_at: null, next_run_at: null, poll_interval_hours: null, actor_count: 0, calendar_url: null });
    const actors = ref([]);
    const events = ref([]);
    const eventsLoading = ref(false);
    const eventsError = ref('');
    const notifications = ref([]);
    const fetchLogs = ref([]);
    const logTab = ref('notify');
    const loadLogs = () => logTab.value === 'fetch'
      ? api('/fetch-logs').then(d => fetchLogs.value = d)
      : api('/notifications').then(d => notifications.value = d);
    const eventsActor = ref(null);
    const futureOnly = ref(false);
    const eventView = ref('calendar');
    const calendarContent = ref('actors');
    const today = ref(EventCalendar.dateKey(new Date()));
    const calendarMonth = ref(today.value.slice(0,7));
    const selectedDate = ref(today.value);
    const weekAnchor = ref(today.value);
    const mergedEvents = computed(() => EventCalendar.mergeEvents(events.value));
    const artistColors = computed(() => EventCalendar.artistColors(actors.value));
    const artistStyle = artist => artistColors.value.get(String(artist?.id)) || EventCalendar.fallbackArtistColor(artist?.id || 0);
    const visibleEvents = computed(() => EventCalendar.filterEvents(mergedEvents.value, eventsActor.value, futureOnly.value, today.value));
    const groupedDays = computed(() => EventCalendar.eventsByDay(visibleEvents.value));
    const calendarDays = computed(() => EventCalendar.monthCells(calendarMonth.value).map(day => {
      const events = groupedDays.value.get(day.key) || [];
      const artists = new Map();
      for (const event of events) for (const artist of event.actors) {
        if (!artists.has(artist.id)) artists.set(artist.id, { ...artist, eventCount:0 });
        artists.get(artist.id).eventCount++;
      }
      return { ...day, events, artists:[...artists.values()] };
    }));
    const monthEventCount = computed(() => visibleEvents.value.filter(e => EventCalendar.validDate(e.date) && e.date.startsWith(calendarMonth.value)).length);
    const undatedEvents = computed(() => groupedDays.value.get('undated') || []);
    const weekDays = computed(() => EventCalendar.weekCells(weekAnchor.value).map((day, index) => ({
      ...day, weekday:['一','二','三','四','五','六','日'][index], events:groupedDays.value.get(day.key) || [],
    })));
    const weekEventCount = computed(() => weekDays.value.reduce((sum,day) => sum + day.events.length, 0));
    const pickWeek = date => {
      if (!EventCalendar.validDate(date)) return;
      weekAnchor.value = date;
      selectedDate.value = date;
      calendarMonth.value = date.slice(0,7);
    };
    const openWeek = () => { pickWeek(EventCalendar.validDate(selectedDate.value) ? selectedDate.value : today.value); eventView.value='week'; };
    const changeWeek = offset => pickWeek(EventCalendar.shiftDate(weekAnchor.value, offset*7));
    const goThisWeek = () => { today.value = EventCalendar.dateKey(new Date()); pickWeek(today.value); };
    const selectedEvents = computed(() => groupedDays.value.get(selectedDate.value) || []);
    const nearestDate = computed(() => {
      const dates = [...groupedDays.value.keys()].filter(EventCalendar.validDate).sort();
      return dates.find(date => date >= today.value) || dates.at(-1) || null;
    });
    const selectDate = date => {
      selectedDate.value = date;
      calendarMonth.value = date.slice(0,7);
      nextTick(() => document.getElementById('calendar-day-details')?.scrollIntoView({behavior:'smooth',block:'nearest'}));
    };
    const pickMonth = month => {
      if (!/^\d{4}-\d{2}$/.test(month) || !EventCalendar.validDate(month + '-01')) return;
      calendarMonth.value = month;
      selectedDate.value = [...groupedDays.value.keys()].filter(date => date.startsWith(month)).sort()[0] || month + '-01';
    };
    const changeMonth = offset => pickMonth(EventCalendar.shiftMonth(calendarMonth.value, offset));
    const goToday = () => { today.value = EventCalendar.dateKey(new Date()); selectDate(today.value); };

    const settings = reactive({ notifiers: {}, poll_interval_hours: 8 });
    const savingSettings = ref(false);
    const testing = ref(false);
    const simulating = ref(false);

    const searchKw = ref('');
    const searching = ref(false);
    const searchResults = ref([]);
    const manualId = ref(null);
    const manualName = ref('');

    const addManual = async () => {
      if (!manualId.value || !manualName.value.trim()) return;
      try {
        await api('/actors', { method: 'POST', body: { actor_id: manualId.value, name: manualName.value.trim() } });
        await refreshActors();
        showToast(`已添加 ${manualName.value.trim()}（首次抓取只建基线）`);
        manualId.value = null; manualName.value = '';
      } catch (e) { showToast(e.message); }
    };

    const api = async (path, opts = {}) => {
      const resp = await fetch('/api' + path, {
        headers: { 'Content-Type': 'application/json' }, ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || resp.statusText);
      }
      return resp.json();
    };

    const refreshStatus = () => api('/status').then(Object.assign.bind(null, status)).catch(() => {});
    const refreshActors = () => api('/actors').then(d => actors.value = d);
    let eventsRequest = 0;
    const refreshEvents = async () => {
      const request = ++eventsRequest;
      eventsLoading.value = true;
      eventsError.value = '';
      today.value = EventCalendar.dateKey(new Date());
      try {
        const data = await api('/events');
        if (request === eventsRequest) events.value = data;
      } catch (e) {
        if (request === eventsRequest) eventsError.value = '读取活动失败：' + e.message;
      } finally {
        if (request === eventsRequest) eventsLoading.value = false;
      }
    };
    const refreshNotifications = () => api('/notifications').then(d => notifications.value = d);

    const doSearch = async () => {
      if (!searchKw.value.trim()) return;
      searching.value = true;
      try {
        const d = await api('/actors/search?keyword=' + encodeURIComponent(searchKw.value.trim()));
        searchResults.value = d.results;
        if (!d.results.length) showToast('没有搜索结果：请使用日文汉字写法（如 斉藤朱夏、藪島朱音）');
      } catch (e) { showToast('搜索失败: ' + e.message); }
      finally { searching.value = false; }
    };

    const addActor = async (r) => {
      try {
        await api('/actors', { method: 'POST', body: { actor_id: r.actor_id, name: r.name } });
        r.watched = true;
        await refreshActors();
        showToast('已添加 ' + r.name + '（首次抓取只建基线）');
      } catch (e) { showToast(e.message); }
    };

    const toggleActor = async (a) => {
      await api('/actors/' + a.actor_id, { method: 'PATCH', body: { enabled: !a.enabled } });
      a.enabled = !a.enabled;
    };

    const delActor = async (a) => {
      if (!confirm('删除 ' + a.name + ' 及其活动快照？')) return;
      await api('/actors/' + a.actor_id, { method: 'DELETE' });
      await refreshActors();
    };

    const runNow = async () => {
      status.running = true;
      try {
        const s = await api('/watch/now', { method: 'POST' });
        const msg = `抓取完成：检查 ${s.checked} 人，失败 ${s.failed}` +
          (s.new_events ? `，发现 ${s.new_events} 场新活动${s.notified ? '，已推送' : '（推送失败，见日志）'}` : '');
        showToast(msg);
      } catch (e) { showToast(e.message); }
      finally {
        status.running = false;
        await Promise.all([refreshStatus(), refreshActors(), refreshEvents(), loadLogs()]);
      }
    };

    const loadSettings = () => api('/settings').then(d => {
      Object.keys(settings).forEach(k => delete settings[k]);
      Object.assign(settings, d);
    });
    const saveSettings = async () => {
      savingSettings.value = true;
      try {
        await api('/settings', { method: 'PUT', body: JSON.parse(JSON.stringify(settings)) });
        showToast('设置已保存');
      } catch (e) { showToast('保存失败: ' + e.message); }
      finally { savingSettings.value = false; }
    };
    const testNotify = async () => {
      testing.value = true;
      try {
        const r = await api('/settings/test-notify', { method: 'POST' });
        const parts = Object.entries(r).map(([k, v]) => k + ':' + (v.ok ? '✅' : '❌ ' + v.error));
        showToast(parts.join(' | '));
        await refreshNotifications();
      } catch (e) { showToast(e.message); }
      finally { testing.value = false; }
    };

    const simulateNotify = async () => {
      simulating.value = true;
      try {
        const r = await api('/watch/simulate', { method: 'POST' });
        showToast(`模拟通知已发送（${r.actors} 位出演者的最近活动），请查看各渠道实际效果`);
        await refreshNotifications();
      } catch (e) { showToast(e.message); }
      finally { simulating.value = false; }
    };

    const channelLabel = (key) => ({ wxpusher: 'WxPusher', pushplus: 'PushPlus', email: '邮件 (SMTP)' }[key] || key);

    const calUrl = computed(() => status.calendar_url
      ? location.origin + status.calendar_url
      : location.origin + '/api/calendar.ics');
    const copyCal = async () => {
      try { await navigator.clipboard.writeText(calUrl.value); showToast('订阅链接已复制'); }
      catch { showToast('复制失败，请手动选择复制'); }
    };

    const importing = ref(false);
    const exportConfig = async () => {
      try {
        const d = await api('/export');
        const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'eventernote-watcher-config.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('配置已导出');
      } catch (e) { showToast('导出失败: ' + e.message); }
    };
    const importConfig = async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      if (!confirm('导入将替换当前出演者列表和设置，确定继续？')) { ev.target.value = ''; return; }
      importing.value = true;
      try {
        const text = await file.text();
        const body = JSON.parse(text);
        const r = await api('/import', { method: 'POST', body });
        showToast(`导入成功：${r.actor_count} 位出演者`);
        await Promise.all([refreshActors(), loadSettings()]);
      } catch (e) {
        showToast('导入失败: ' + (e.message.includes('JSON') ? '文件不是有效的 JSON' : e.message));
      } finally {
        importing.value = false;
        ev.target.value = '';
      }
    };

    watch(tab, (t) => {
      if (t === 'events') refreshEvents();
      if (t === 'logs') loadLogs();
    });

    onMounted(async () => {
      await Promise.all([refreshStatus(), refreshActors(), loadSettings(), refreshEvents()]);
      setInterval(refreshStatus, 15000);
    });

    return {
      tab, toast, status, actors, events, notifications, fetchLogs, logTab, eventsActor, futureOnly,
      settings, savingSettings, testing, searchKw, searching, searchResults,
      doSearch, addActor, toggleActor, delActor, runNow, saveSettings, testNotify, simulateNotify, channelLabel,
      calUrl, copyCal, exportConfig, importConfig, importing, manualId, manualName, addManual,
      eventsLoading, eventsError, refreshEvents, eventView, calendarContent, today, calendarMonth, selectedDate,
      visibleEvents, calendarDays, monthEventCount, undatedEvents, selectedEvents, nearestDate,
      selectDate, pickMonth, changeMonth, goToday, artistStyle,
      weekAnchor, weekDays, weekEventCount, pickWeek, openWeek, changeWeek, goThisWeek,
    };
  },
}).mount('#app');
</script>
</body>
</html>
